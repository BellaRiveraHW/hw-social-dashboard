<head>

  <style>
    :root {
      --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3250;
      --accent:#6c63ff; --accent2:#00d4aa; --text:#e8eaf6; --text-muted:#8b92b8;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    header {
      background:linear-gradient(135deg,#1a1d27,#12152a);
      border-bottom:1px solid var(--border);
      padding:18px 32px;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    }
    .header-left h1 { font-size:1.3rem; font-weight:800; }
    .header-left h1 span { background:linear-gradient(90deg,#6c63ff,#00d4aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .header-left p { color:var(--text-muted); font-size:0.8rem; margin-top:3px; }
    .back-btn {
      background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
      padding:8px 16px; border-radius:8px; font-size:0.82rem; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; text-decoration:none;
      transition:border-color 0.15s, color 0.15s;
    }
    .back-btn:hover { border-color:var(--accent); color:var(--accent); }

    main { padding:24px 32px; max-width:1300px; margin:0 auto; }

    /* Phase pills */
    .phase-strip {
      display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap;
    }
    .phase-pill {
      padding:7px 18px; border-radius:20px; font-size:0.75rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;
      border:1px solid; transition:opacity 0.15s;
    }
    .phase-pill:not(.active) { opacity:0.4; }
    .phase-pill.active { opacity:1; }
    .p0 { color:#9c27b0; border-color:#9c27b0; background:#1a1a2e; }
    .p1 { color:#00d4aa; border-color:#00d4aa; background:#1a2a1a; }
    .p2 { color:#ff6b6b; border-color:#ff6b6b; background:#2a1a1a; }
    .p3 { color:#ffd93d; border-color:#ffd93d; background:#2a2a1a; }

    /* Timeline */
    .timeline {
      display:flex; overflow-x:auto; padding-bottom:12px; margin-bottom:28px;
      gap:0; scrollbar-width:thin; scrollbar-color:var(--border) transparent;
    }
    .tl-item { display:flex; flex-direction:column; align-items:center; min-width:80px; position:relative; }
    .tl-item:not(:last-child)::after {
      content:''; position:absolute; top:11px; left:50%; width:100%; height:2px;
      background:var(--border); z-index:0;
    }
    .tl-dot {
      width:22px; height:22px; border-radius:50%; border:2px solid; z-index:1;
      background:var(--bg); cursor:pointer; display:flex; align-items:center;
      justify-content:center; font-size:0.58rem; font-weight:800;
      transition:transform 0.15s; flex-shrink:0;
    }
    .tl-dot:hover { transform:scale(1.25); }
    .tl-date { font-size:0.58rem; color:var(--text-muted); margin-top:4px; text-align:center; line-height:1.3; }

    /* Phase header */
    .phase-header {
      display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;
    }
    .phase-badge {
      padding:5px 14px; border-radius:20px; font-size:0.72rem; font-weight:800;
      text-transform:uppercase; letter-spacing:0.06em; border:1px solid;
    }
    .phase-sub { font-size:0.78rem; color:var(--text-muted); }

    /* Post cards grid */
    .posts-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:16px; margin-bottom:36px;
    }

    .post-card {
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      overflow:hidden; transition:transform 0.15s, border-color 0.15s;
    }
    .post-card:hover { transform:translateY(-2px); border-color:var(--accent); }

    .card-top {
      padding:14px 16px 10px; border-bottom:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    }
    .card-date { font-size:0.75rem; font-weight:700; color:var(--accent2); margin-bottom:3px; }
    .card-title { font-size:0.88rem; font-weight:700; line-height:1.3; }
    .card-num { font-size:1.6rem; font-weight:900; color:var(--border); line-height:1; flex-shrink:0; }

    .card-visual {
      padding:7px 14px; font-size:0.7rem; color:var(--text-muted);
      background:var(--surface2); border-bottom:1px solid var(--border);
      line-height:1.5;
    }
    .card-visual strong { color:var(--accent); }

    .card-platforms {
      display:flex; gap:5px; padding:10px 14px; flex-wrap:wrap;
      border-bottom:1px solid var(--border);
    }
    .plat-btn {
      font-size:0.68rem; font-weight:700; padding:3px 10px; border-radius:20px;
      border:1px solid; cursor:pointer; background:transparent;
      font-family:'Inter',sans-serif; transition:opacity 0.15s;
    }
    .plat-btn.on { opacity:1; }
    .plat-btn.off { opacity:0.35; }

    .card-copy { padding:12px 14px; min-height:110px; }
    .copy-text {
      font-size:0.76rem; line-height:1.7; color:var(--text);
      white-space:pre-wrap; word-break:break-word;
    }
    .copy-text .ht { color:var(--accent); }
    .copy-text .url { color:var(--accent2); font-weight:600; }

    .card-footer {
      padding:8px 14px 12px; display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border);
    }
    .char-ct { font-size:0.67rem; color:var(--text-muted); }
    .copy-btn {
      font-size:0.72rem; font-weight:600; padding:5px 12px; border-radius:7px;
      border:1px solid var(--border); background:var(--surface2); color:var(--text-muted);
      cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s;
    }
    .copy-btn:hover { border-color:var(--accent); color:var(--accent); }
    .copy-btn.ok { border-color:var(--accent2); color:var(--accent2); }

    /* Note box */
    .note-box {
      background:#2a2a1a; border:1px solid #ffd93d44; border-radius:10px;
      padding:12px 16px; font-size:0.78rem; color:#f0d080; margin-bottom:20px;
      line-height:1.5;
    }

    footer {
      text-align:center; padding:24px; color:var(--text-muted); font-size:0.75rem;
      border-top:1px solid var(--border); margin-top:12px;
    }
    footer a { color:var(--accent); text-decoration:none; }

    @media(max-width:600px) {
      main { padding:16px; }
      header { padding:14px 16px; }
      .posts-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/(#\w+)/g,'<span class="ht">$1</span>')
    .replace(/(housingwire\.com\/\S+)/g,'<span class="url">$1</span>');
}

function buildTimeline() {
  const tl = document.getElementById("timeline");
  POSTS.forEach(p => {
    const ph = PHASES[p.phase];
    const div = document.createElement("div");
    div.className = "tl-item";
    div.innerHTML = `<div class="tl-dot" style="border-color:${ph.color};color:${ph.color}" onclick="jump(${p.num})">${p.num}</div><div class="tl-date">${p.dateShort}</div>`;
    tl.appendChild(div);
  });
}

function buildPhaseStrip() {
  const strip = document.getElementById("phase-strip");
  PHASES.forEach(ph => {
    const btn = document.createElement("button");
    btn.className = `phase-pill ${ph.cls} active`;
    btn.textContent = ph.label;
    btn.onclick = () => jump(POSTS.find(p => p.phase === ph.id)?.num || 1);
    strip.appendChild(btn);
  });
}

function buildPosts() {
  const container = document.getElementById("posts-container");
  let currentPhase = -1;

  POSTS.forEach(p => {
    const ph = PHASES[p.phase];

    if (p.phase !== currentPhase) {
      currentPhase = p.phase;
      const hdr = document.createElement("div");
      hdr.className = "phase-header";
      hdr.id = "phase-" + p.phase;
      hdr.innerHTML = `
        <div class="phase-badge ${ph.cls}">${ph.label}</div>
        <div class="phase-sub">${ph.sub}</div>`;
      container.appendChild(hdr);

      if (p.num === 14) {
        const note = document.createElement("div");
        note.className = "note-box";
        note.innerHTML = "⚠️ <strong>Post #14 reminder:</strong> Replace <code>[Insert data point or market insight here]</code> with a real stat from HousingWire Intelligence before scheduling.";
        container.appendChild(note);
      }
    }

    const card = document.createElement("div");
    card.className = "post-card";
    card.id = "post-" + p.num;

    // Visual brief — show first line only, expand on hover via title attr
    const visualFirst = p.visual.split("\n")[0];
    const visualFull = p.visual;

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-date">${p.date}</div>
          <div class="card-title">${p.title}</div>
        </div>
        <div class="card-num">#${p.num}</div>
      </div>
      <div class="card-visual" title="${visualFull.replace(/"/g,'&quot;')}">
        <strong>📐 Visual:</strong> ${visualFirst}
        ${p.visual.includes('\n') ? '<span style="color:var(--accent);cursor:help"> [hover for details]</span>' : ''}
      </div>
      <div class="card-platforms" id="plats-${p.num}"></div>
      <div class="card-copy"><div class="copy-text" id="ct-${p.num}"></div></div>
      <div class="card-footer">
        <span class="char-ct" id="cc-${p.num}"></span>
        <button class="copy-btn" id="cb-${p.num}" onclick="copyIt(${p.num})">📋 Copy</button>
      </div>`;

    // Wrap in a grid row if needed
    let grid = container.lastElementChild;
    if (!grid || !grid.classList.contains("posts-grid")) {
      grid = document.createElement("div");
      grid.className = "posts-grid";
      container.appendChild(grid);
    }
    grid.appendChild(card);

    // Build platform buttons
    const platsDiv = card.querySelector("#plats-" + p.num);
    p.platforms.forEach(plat => {
      const pm = PLAT[plat];
      const btn = document.createElement("button");
      btn.className = "plat-btn " + (plat === sel[p.num] ? "on" : "off");
      btn.style.cssText = `color:${pm.color};border-color:${pm.color}`;
      btn.textContent = pm.label;
      btn.onclick = () => switchPlat(p.num, plat);
      platsDiv.appendChild(btn);
    });

    updateCopy(p.num);
  });
}

function updateCopy(num) {
  const p = POSTS.find(x => x.num === num);
  const plat = sel[num];
  const text = p.copy[plat] || "";
  document.getElementById("ct-" + num).innerHTML = fmt(text);
  document.getElementById("cc-" + num).textContent = text.length + " chars";
}

function switchPlat(num, plat) {
  sel[num] = plat;
  const card = document.getElementById("post-" + num);
  card.querySelectorAll(".plat-btn").forEach(btn => {
    const match = btn.textContent.trim() === PLAT[plat].label;
    btn.className = "plat-btn " + (match ? "on" : "off");
  });
  updateCopy(num);
}

function copyIt(num) {
  const p = POSTS.find(x => x.num === num);
  navigator.clipboard.writeText(p.copy[sel[num]] || "").then(() => {
    const btn = document.getElementById("cb-" + num);
    btn.textContent = "✅ Copied!";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "📋 Copy"; btn.classList.remove("ok"); }, 2000);
  });
}

function jump(num) {
  const el = document.getElementById("post-" + num);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
}

// Init
buildTimeline();
buildPhaseStrip();
buildPosts();
</script>
</body>
</html>
